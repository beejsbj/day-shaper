<!DOCTYPE html>
<html lang="en" class="instant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day Shaper</title>
<meta name="description" content="Shape a what-if day on a ring of clay, under a sky that follows the real sun.">
<meta name="theme-color" content="#b3cce8">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Day Shaper">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Day Shaper">
<meta property="og:description" content="Shape a what-if day on a ring of clay, under a sky that follows the real sun.">
<meta property="og:image" content="https://day-shaper-psi.vercel.app/icons/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div id="scene" aria-hidden="true">
  <div class="sky"></div>
  <div class="stars"></div>
  <svg class="moon" viewBox="0 0 40 40"><circle class="moon-dark" cx="20" cy="20" r="16"/><path class="moon-lit" d=""/></svg>
  <div class="hsun"></div>
  <svg class="ridges" preserveAspectRatio="none"></svg>
  <div class="clouds"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="rain"></div>
  <div class="snow"></div>
</div>

<main id="app">
  <header id="top">
    <div class="words">
      <h1 id="title">Day Shaper</h1>
      <p id="subtitle">&nbsp;</p>
    </div>
    <button id="menuBtn" class="round" type="button" aria-label="Menu" aria-haspopup="dialog"></button>
    <button id="doneBtn" class="pill" type="button" hidden></button>
  </header>

  <section id="dialWrap">
    <svg id="dial" role="img" aria-label="Your day"></svg>
  </section>

  <footer id="bottom">
    <div id="toast" class="off" role="status"><span id="toastText"></span><button id="toastUndo" type="button">Undo</button></div>
    <div id="livePanel" class="panel">
      <ul id="readings" aria-label="Today"></ul>
      <p id="status" class="pill quiet" hidden></p>
      <div class="row">
        <span class="row-side" aria-hidden="true"></span>
        <button id="shapeBtn" class="pill" type="button"></button>
        <span class="row-side end"><button id="nowTopBtn" class="round" type="button" aria-pressed="false" aria-label="Now on top"></button></span>
      </div>
    </div>
    <div id="shapePanel" class="panel off" inert>
      <p id="trayHint">Tap a stone to add it · or drag it onto the ring</p>
      <div id="tray" role="toolbar" aria-label="Add to your day"></div>
    </div>
    <div id="playPanel" class="panel off" inert>
      <p id="playTime" class="play-time"></p>
      <button id="stopPlay" class="round big" type="button" aria-label="Stop playing"></button>
    </div>
  </footer>
</main>

<div id="ghost" aria-hidden="true"></div>
<div id="announce" class="sr-only" aria-live="polite"></div>

<dialog id="menu" aria-labelledby="menuTitle">
  <form method="dialog" class="sheet">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="menuTitle">Day Shaper</h2>
    <p class="sheet-sub" id="menuSub"></p>
    <div class="group">
      <button type="button" class="item" data-act="play"><span class="ic" data-i="play"></span><span class="lbl">Play the day<small>Watch your shaped day pass in 24 seconds</small></span></button>
      <button type="button" class="item" data-act="share"><span class="ic" data-i="share"></span><span class="lbl">Share this day<small>A link that opens your day as it is</small></span></button>
    </div>
    <div class="group">
      <button type="button" class="item" data-act="hour12" role="switch" aria-checked="false"><span class="ic" data-i="clock"></span><span class="lbl">24-hour clock</span><span class="switch"></span></button>
      <button type="button" class="item" data-act="locate"><span class="ic" data-i="pin"></span><span class="lbl"><span id="whereLine">Where you are</span><small id="locNote"></small></span></button>
    </div>
    <div class="group">
      <button type="button" class="item" data-act="sample"><span class="ic" data-i="reset"></span><span class="lbl">Start from a sample day</span></button>
      <button type="button" class="item" data-act="clear"><span class="ic" data-i="clear"></span><span class="lbl">Clear the day</span></button>
      <a class="item" href="design-system/"><span class="ic" data-i="palette"></span><span class="lbl">Design system</span></a>
    </div>
    <button class="pill close" value="close">Close</button>
  </form>
</dialog>

<dialog id="nameDlg" aria-labelledby="nameTitle">
  <form method="dialog" class="sheet name-sheet">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="nameTitle">Name this block</h2>
    <p class="sheet-sub" id="nameSub"></p>
    <input id="nameInput" type="text" maxlength="24" autocomplete="off" enterkeyhint="done" spellcheck="false">
    <div id="nameIdeas" class="ideas"></div>
    <div class="sheet-actions">
      <button type="button" class="pill" id="nameClear">Use the clay's name</button>
      <button type="submit" class="pill strong" id="nameSave" value="save">Save</button>
    </div>
  </form>
</dialog>

<div id="rotate" aria-hidden="true"><p>Hold it upright<br><small>the day is shaped in portrait</small></p></div>
<noscript><p class="noscript">Day Shaper needs JavaScript to shape your day.</p></noscript>
</body>
</html>
